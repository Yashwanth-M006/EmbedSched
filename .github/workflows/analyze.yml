name: EmbedSched Analysis & Safety Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite or Case to execute'
        required: true
        default: 'Test_Suite1/Test_1'
        type: choice
        options:
          - Test_Suite1/Test_1
          - Test_Suite1/Test_2
          - Test_Suite1/Test_3
          - Test_Suite1/Test_4
          - Test_Suite1/Test_5
          - Test_Suite1/Test_6
          - Test_Suite1/Test_7
          - Test_Suite1/Test_8
          - Test_Suite2/Test_1
          - Test_Suite3/Test_1
          - run_all_suites
          - custom
      elf_path:
        description: 'Custom ELF path (if custom is selected)'
        required: false
        default: ''
      map_path:
        description: 'Custom MAP path (if custom is selected)'
        required: false
        default: ''
      ld_path:
        description: 'Custom Linker script path (if custom is selected)'
        required: false
        default: ''
      chip_yaml:
        description: 'Custom Chip YAML path (if custom is selected)'
        required: false
        default: ''
      autosar_config:
        description: 'Custom AUTOSAR configuration JSON path (optional)'
        required: false
        default: ''

jobs:
  analyze:
    name: Run EmbedSched Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Report Output Directory
        run: mkdir -p reports

      - name: Run EmbedSched Analysis
        run: |
          TARGET="${{ github.event.inputs.test_suite }}"
          if [ -z "$TARGET" ]; then
            TARGET="Test_Suite1/Test_1"
          fi

          if [ "$TARGET" = "run_all_suites" ]; then
            echo "Running pytest test suite across all suites..."
            pytest -v tests/
          elif [ "$TARGET" != "custom" ]; then
            TEST_DIR="tests/$TARGET"
            echo "Analyzing $TEST_DIR..."

            ELF=$(find "$TEST_DIR" -maxdepth 1 -name "*.elf" | head -n 1)
            MAP=$(find "$TEST_DIR" -maxdepth 1 -name "*.map" | head -n 1)
            LD=$(find "$TEST_DIR" -maxdepth 1 -name "*.ld" | head -n 1)
            CHIP=$(find "$TEST_DIR" -maxdepth 1 -name "*.yaml" -o -name "*.yml" | head -n 1)
            AUTOSAR=$(find "$TEST_DIR" -maxdepth 1 -name "*autosar*.json" -o -name "schedule.json" -o -name "*.json" | head -n 1)

            # Fallback to suite defaults if missing in specific subtest
            if [ -z "$ELF" ]; then ELF=$(find tests/Test_Suite1/Test_1 -name "*.elf" | head -n 1); fi
            if [ -z "$MAP" ]; then MAP=$(find tests/Test_Suite1/Test_1 -name "*.map" | head -n 1); fi
            if [ -z "$LD" ]; then LD=$(find tests/Test_Suite1/Test_1 -name "*.ld" | head -n 1); fi
            if [ -z "$CHIP" ]; then CHIP=$(find tests/Test_Suite1/Test_1 -name "*.yaml" | head -n 1); fi

            mkdir -p reports/charts
            CMD="python main.py --elf $ELF --map $MAP --ld $LD --chip $CHIP --output reports/analysis_report.md --charts-dir reports/charts"
            if [ -n "$AUTOSAR" ]; then
              CMD="$CMD --autosar-config $AUTOSAR"
            fi

            echo "Executing: $CMD"
            eval $CMD
          else
            mkdir -p reports/charts
            CMD="python main.py --elf ${{ github.event.inputs.elf_path }} --map ${{ github.event.inputs.map_path }} --ld ${{ github.event.inputs.ld_path }} --chip ${{ github.event.inputs.chip_yaml }} --output reports/analysis_report.md --charts-dir reports/charts"
            if [ -n "${{ github.event.inputs.autosar_config }}" ]; then
              CMD="$CMD --autosar-config ${{ github.event.inputs.autosar_config }}"
            fi
            echo "Executing: $CMD"
            eval $CMD
          fi

      - name: Publish Report in Job Summary
        if: always()
        run: |
          if [ -f reports/analysis_report.md ]; then
            cat reports/analysis_report.md >> $GITHUB_STEP_SUMMARY

            # Embed generated charts into job summary
            if [ -d reports/charts ] && [ "$(ls -A reports/charts)" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "## 📈 Generated Visual Charts" >> $GITHUB_STEP_SUMMARY
              
              # If the test suite has tracked charts in the repository, link them via raw.githubusercontent
              RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/$TARGET/charts"
              
              for img in reports/charts/*.png; do
                if [ -f "$img" ]; then
                  fname=$(basename "$img")
                  echo "### $fname" >> $GITHUB_STEP_SUMMARY
                  echo "![$fname]($RAW_BASE/$fname)" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              done
            fi
          else
            echo "### ℹ️ Test run completed. Full log available in run console." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedsched-analysis-report
          path: reports/
